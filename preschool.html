<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باغ یادگیری - پیش‌دبستانی</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb347">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="باغ یادگیری">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Vazir', 'Tahoma', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f9e7b3, #f5d9a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            max-width: 750px;
            width: 100%;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            border-radius: 80px 20px 80px 20px;
            padding: 25px 20px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 4px solid #ffb347;
        }
        .back-home {
            display: inline-block;
            background: #4d2e1b;
            color: #ffdd99;
            padding: 8px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #1a0f08;
            transition: 0.1s;
        }
        .back-home:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1a0f08;
        }
        h1 {
            font-size: 2rem;
            color: #d45a1a;
            text-shadow: 3px 3px 0 #ffeeaa;
            margin-bottom: 3px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #7a4a2a;
            background: #ffdd99;
            display: inline-block;
            padding: 3px 20px;
            border-radius: 50px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        /* ============================================
           USER DASHBOARD
           ============================================ */
        .user-dashboard {
            background: linear-gradient(135deg, #2d1b0e, #4d2e1b);
            border-radius: 30px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: #ffdd99;
            box-shadow: 0 8px 0 #1a0f08;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .user-avatar {
            background: #ffb347;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #2d1b0e;
        }
        .user-details {
            text-align: right;
        }
        .user-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        .user-phone {
            font-size: 0.7rem;
            color: #ffdd99;
            opacity: 0.8;
        }
        .btn-logout {
            background: #e74c3c;
            border: none;
            border-radius: 60px;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 3px 0 #a93226;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-logout:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #a93226;
        }

        /* ============================================
           SUBJECT SELECTOR
           ============================================ */
        .subject-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .subject-btn {
            padding: 18px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 4px solid #cc8f5a;
            border-radius: 60px;
            background: #fff5e6;
            color: #4d2e1b;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 7px 0 #b97c4a;
            flex: 1;
            min-width: 120px;
        }
        .subject-btn.active {
            background: #ffb347;
            color: #2d1b0e;
            transform: scale(0.96);
            box-shadow: 0 3px 0 #b97c4a;
            border-color: #ffb347;
        }
        .subject-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 0 #b97c4a;
        }
        .subject-icon {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        /* ============================================
           VIDEO SECTION
           ============================================ */
        .video-section {
            margin-bottom: 18px;
            background: #1a1a2e;
            border-radius: 30px 10px 30px 10px;
            border: 4px solid #ffb347;
            overflow: hidden;
            box-shadow: 0 8px 0 #1a0f08;
            display: none;
        }
        .video-section.visible {
            display: block;
        }
        .video-header {
            background: linear-gradient(90deg, #d45a1a, #ffb347);
            color: #fff;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .video-header .video-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-header .close-video {
            background: rgba(0,0,0,0.3);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .video-header .close-video:hover {
            background: rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2d1b0e, #4d2e1b);
            color: #ffdd99;
            gap: 10px;
            padding: 20px;
            text-align: center;
        }
        .video-placeholder .placeholder-icon {
            font-size: 3.5rem;
        }
        .video-placeholder .placeholder-text {
            font-size: 1rem;
            font-weight: bold;
        }
        .video-placeholder .placeholder-hint {
            font-size: 0.8rem;
            opacity: 0.7;
            direction: ltr;
            font-family: monospace;
        }

        /* ============================================
           PROGRESS REPORTS
           ============================================ */
        .report-section {
            margin: 12px 0;
            background: #fff5e6;
            border-radius: 30px;
            padding: 12px 15px;
            border: 2px solid #ffb347;
            display: none;
        }
        .report-section.visible {
            display: block;
        }
        .report-header {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 5px;
        }
        .report-header .report-toggle {
            flex: 1;
            margin-bottom: 0;
        }
        .reset-btn {
            background: #e74c3c;
            border: none;
            border-radius: 60px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 #a93226;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #a93226;
        }
        .report-toggle {
            border: none;
            border-radius: 60px;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: 0.1s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .report-toggle:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }
        .report-toggle.math-toggle {
            background: #2980b9;
        }
        .report-toggle.alphabet-toggle {
            background: #8e44ad;
        }
        .report-content {
            display: none;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            text-align: right;
            margin-top: 10px;
        }
        .report-content.show {
            display: block;
        }
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            direction: rtl;
        }
        .report-table th {
            background: #4d2e1b;
            color: #ffdd99;
            padding: 8px;
            border-radius: 10px;
        }
        .report-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #e0c9b0;
        }
        .report-table .correct {
            color: #27ae60;
            font-weight: bold;
        }
        .report-table .wrong {
            color: #e74c3c;
            font-weight: bold;
        }
        .report-table .item-cell {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .report-empty {
            color: #7a4a2a;
            padding: 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        /* ============================================
           LEVEL INFO
           ============================================ */
        .level-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            background: #fff5e6;
            padding: 10px 20px;
            border-radius: 60px;
            border: 2px solid #ffb347;
        }
        .level-info span {
            font-weight: bold;
            color: #4d2e1b;
        }
        .level-info .highlight {
            color: #d45a1a;
            font-size: 1.2rem;
        }

        /* ============================================
           QUESTION CARD
           ============================================ */
        .question-card {
            background: #fef7e9;
            border-radius: 60px 20px 60px 20px;
            padding: 25px 15px;
            border: 3px dashed #ff8c42;
            margin-bottom: 18px;
            min-height: 220px;
        }
        .question-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .question-text {
            font-size: 2rem;
            font-weight: bold;
            color: #2d1b0e;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            line-height: 2.5rem;
        }
        .question-text .emoji-big {
            font-size: 3rem;
            line-height: 1;
        }
        .question-text .math {
            font-family: 'Times New Roman', 'Vazir', serif;
            font-size: 2rem;
            color: #c0392b;
            direction: ltr;
            display: inline-block;
            padding: 0 4px;
        }

        .audio-btn {
            background: #4CAF50;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e7d32;
            transition: 0.15s;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .audio-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2e7d32;
        }
        .audio-btn.playing {
            background: #f39c12;
            box-shadow: 0 4px 0 #d68910;
            animation: pulse 0.8s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ============================================
           OPTIONS
           ============================================ */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 15px;
        }
        .option-btn {
            background: #f5d6b3;
            border: 4px solid #cc8f5a;
            border-radius: 100px;
            padding: 14px 22px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2d1b0e;
            min-width: 80px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 7px 0 #8b5e38;
            flex: 1 0 auto;
            max-width: 140px;
        }
        .option-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #8b5e38;
        }
        .option-btn.correct-highlight {
            background: #6fcf97;
            border-color: #27ae60;
            box-shadow: 0 0 15px #6fcf97;
        }
        .option-btn.wrong-highlight {
            background: #f28b82;
            border-color: #c0392b;
            box-shadow: 0 0 15px #f28b82;
        }
        .option-btn:disabled {
            opacity: 0.7;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #8b5e38;
            cursor: not-allowed;
        }

        /* ============================================
           FEEDBACK
           ============================================ */
        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 60px;
            margin: 8px 0;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .feedback.correct {
            color: #1e7e34;
            background: #d5f5e3;
        }
        .feedback.wrong {
            color: #922b21;
            background: #fadbd8;
        }
        .feedback.info {
            color: #1a5276;
            background: #d6eaf8;
        }
        .feedback.level-complete {
            color: #1a5276;
            background: #fef9e7;
            border: 3px solid #f1c40f;
        }
        .feedback.all-done {
            color: #1a5276;
            background: #e8f8f5;
            border: 3px solid #1abc9c;
        }

        /* ============================================
           PROGRESS BAR
           ============================================ */
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: #e0c9b0;
            border-radius: 50px;
            margin: 10px 0 8px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffb347, #ff8c42);
            border-radius: 50px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .next-btn {
            background: #ffa726;
            border: none;
            border-radius: 60px;
            padding: 14px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2d1b0e;
            box-shadow: 0 7px 0 #b86d1c;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 5px;
            width: 100%;
        }
        .next-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #b86d1c;
        }
        .next-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #b86d1c;
            pointer-events: none;
        }
        .btn-restart {
            background: #27ae60;
            border: none;
            border-radius: 60px;
            padding: 14px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 7px 0 #1e7e34;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 5px;
            width: 100%;
        }
        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #1e7e34;
        }

        /* ============================================
           MODAL
           ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff5e6;
            border-radius: 60px 20px 60px 20px;
            padding: 35px 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 4px solid #ffb347;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-box h2 {
            color: #2d1b0e;
            margin-bottom: 18px;
            font-size: 1.6rem;
        }
        .modal-box label {
            display: block;
            text-align: right;
            font-weight: bold;
            color: #4d2e1b;
            margin-top: 12px;
            margin-bottom: 5px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #cc8f5a;
            border-radius: 60px;
            font-size: 1rem;
            background: #fff;
            direction: ltr;
            text-align: center;
        }
        .modal-box input:focus {
            border-color: #ffb347;
            outline: none;
            box-shadow: 0 0 15px #ffb34755;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #8b5e38;
        }
        .modal-actions button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8b5e38;
        }
        .btn-login {
            background: #ffb347;
            color: #2d1b0e;
        }
        .btn-register {
            background: #27ae60;
            color: #fff;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .btn-close-modal {
            background: #e74c3c;
            color: #fff;
            box-shadow: 0 4px 0 #a93226;
            flex: 0.4;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 550px) {
            .game-container { padding: 15px 10px; }
            h1 { font-size: 1.6rem; }
            .user-dashboard { flex-direction: column; align-items: stretch; }
            .subject-btn { font-size: 1.2rem; padding: 12px 15px; min-width: 80px; }
            .subject-icon { font-size: 2rem; }
            .question-text { font-size: 1.4rem; }
            .question-text .emoji-big { font-size: 2.2rem; }
            .question-text .math { font-size: 1.5rem; }
            .option-btn { font-size: 1.4rem; padding: 10px 8px; min-width: 60px; }
            .feedback { font-size: 1.1rem; }
            .modal-box { padding: 20px 15px; }
            .audio-btn { width: 45px; height: 45px; font-size: 1.4rem; }
            .report-toggle { font-size: 0.9rem; padding: 10px 12px; }
            .report-table { font-size: 0.8rem; }
            .reset-btn { padding: 10px 14px; font-size: 0.9rem; }
            .video-header { font-size: 0.85rem; padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="index.html" class="back-home">🏠 بازگشت به صفحه اصلی</a>

        <h1>🧸 پیش‌دبستانی</h1>
        <div class="subtitle">✨ آموزش الفبا و ریاضی ✨</div>

        <!-- ==========================================
        داشبورد کاربر
        ========================================== -->
        <div class="user-dashboard" id="userDashboard">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="userName">میهمان عزیز</div>
                    <div class="user-phone" id="userPhone">وارد نشده‌اید</div>
                </div>
            </div>
            <div>
                <button class="btn-logout" id="btnLogout" style="display:none;">🚪 خروج</button>
                <button class="btn-logout" id="btnLoginShow" style="background:#ffb347; box-shadow:0 4px 0 #b86d1c; color:#2d1b0e;">🔑 ورود</button>
            </div>
        </div>

        <!-- ==========================================
        انتخاب مبحث
        ========================================== -->
        <div class="subject-selector" id="subjectSelector">
            <button class="subject-btn active" data-subject="math" id="btnMath">
                <span class="subject-icon">🔢</span>
                ریاضی
            </button>
            <button class="subject-btn" data-subject="alphabet" id="btnAlphabet">
                <span class="subject-icon">🔤</span>
                الفبا
            </button>
        </div>

        <!-- ==========================================
        ویدیوی آموزشی
        ========================================== -->
        <div class="video-section" id="videoSection">
            <div class="video-header">
                <div class="video-title" id="videoTitle">
                    🎥 آموزش اعداد
                </div>
                <button class="close-video" id="closeVideoBtn" title="بستن ویدیو">✖</button>
            </div>
            <div class="video-wrapper" id="videoWrapper">
                <!-- iframe اینجا قرار می‌گیرد -->
            </div>
        </div>

        <!-- ==========================================
        اطلاعات مرحله
        ========================================== -->
        <div class="level-info">
            <span>📝 سوال <span class="highlight" id="questionCounter">۱</span> از <span class="highlight" id="totalQuestions">۵</span></span>
        </div>

        <!-- ==========================================
        کارت سوالات
        ========================================== -->
        <div class="question-card" id="questionCard">
            <div class="question-header">
                <div class="question-text" id="questionDisplay">
                    🍎🍎 چند تا سیب می‌بینی؟
                </div>
                <button class="audio-btn" id="audioBtn" title="گوش دادن به سوال">🔊</button>
            </div>
            <div class="options-container" id="optionsContainer">
                <button class="option-btn" data-index="0">۱</button>
                <button class="option-btn" data-index="1">۲</button>

        // ====================================================
        //  گزارش عملکرد
        // ====================================================
        let mathStats = {};
        let letterStats = {};

        function loadStats() {
            const savedMath = localStorage.getItem(MATH_STATS_KEY);
            if (savedMath) {
                try { mathStats = JSON.parse(savedMath); } catch(e) {}
            }
            const savedLetter = localStorage.getItem(LETTER_STATS_KEY);
            if (savedLetter) {
                try { letterStats = JSON.parse(savedLetter); } catch(e) {}
            }
        }

        function saveStats() {
            try {
                localStorage.setItem(MATH_STATS_KEY, JSON.stringify(mathStats));
                localStorage.setItem(LETTER_STATS_KEY, JSON.stringify(letterStats));
            } catch(e) {}
        }

        function updateStats(subject, item, isCorrect) {
            if (!item) return;
            const stats = (subject === 'math') ? mathStats : letterStats;
            if (!stats[item]) {
                stats[item] = { correct: 0, wrong: 0 };
            }
            if (isCorrect) {
                stats[item].correct += 1;
            } else {
                stats[item].wrong += 1;
            }
            saveStats();
            if (subject === 'math') {
                updateMathReport();
            } else {
                updateAlphabetReport();
            }
        }

        // ===== گزارش ریاضی (مرتب از ۱ تا ۱۰) =====
        function updateMathReport() {
            const reportBody = document.getElementById('mathReportBody');
            const numberOrder = ['۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹', '۱۰'];
            const items = numberOrder.filter(key => {
                const s = mathStats[key];
                return s && (s.correct > 0 || s.wrong > 0);
            });

            if (items.length === 0) {
                reportBody.innerHTML = '<div class="report-empty">🎯 هنوز هیچ سوال ریاضی تمرین نشده است.</div>';
                return;
            }

            let html = `
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>عدد</th>
                            <th>✅ درست</th>
                            <th>❌ اشتباه</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            items.forEach(key => {
                const s = mathStats[key];
                const total = s.correct + s.wrong;
                const percentage = total > 0 ? Math.round((s.correct / total) * 100) : 0;
                const status = percentage >= 80 ? '🌟 عالی' : (percentage >= 50 ? '👍 خوب' : '📚 نیاز به تمرین');
                const statusColor = percentage >= 80 ? '#27ae60' : (percentage >= 50 ? '#f1c40f' : '#e74c3c');

                html += `
                    <tr>
                        <td class="item-cell">${key}</td>
                        <td class="correct">${s.correct}</td>
                        <td class="wrong">${s.wrong}</td>
                        <td style="color:${statusColor};font-weight:bold;">${status}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div style="margin-top:10px;font-size:0.8rem;color:#7a4a2a;">
                    💡 اعدادی که وضعیت «نیاز به تمرین» دارند را بیشتر تمرین کنید.
                </div>
            `;

            reportBody.innerHTML = html;
        }

        // ===== گزارش الفبا (مرتب بر اساس الفبا) =====
        function updateAlphabetReport() {
            const reportBody = document.getElementById('alphabetReportBody');
            const alphabetOrder = ['آ', 'ب', 'پ', 'ت', 'ث', 'ج', 'چ', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'ژ', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ک', 'گ', 'ل', 'م', 'ن', 'و', 'ه', 'ی'];
            const items = alphabetOrder.filter(key => {
                const s = letterStats[key];
                return s && (s.correct > 0 || s.wrong > 0);
            });

            if (items.length === 0) {
                reportBody.innerHTML = '<div class="report-empty">🎯 هنوز هیچ حرفی تمرین نشده است.</div>';
                return;
            }

            let html = `
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>حرف</th>
                            <th>✅ درست</th>
                            <th>❌ اشتباه</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            items.forEach(key => {
                const s = letterStats[key];
                const total = s.correct + s.wrong;
                const percentage = total > 0 ? Math.round((s.correct / total) * 100) : 0;
                const status = percentage >= 80 ? '🌟 عالی' : (percentage >= 50 ? '👍 خوب' : '📚 نیاز به تمرین');
                const statusColor = percentage >= 80 ? '#27ae60' : (percentage >= 50 ? '#f1c40f' : '#e74c3c');

                html += `
                    <tr>
                        <td class="item-cell">${key}</td>
                        <td class="correct">${s.correct}</td>
                        <td class="wrong">${s.wrong}</td>
                        <td style="color:${statusColor};font-weight:bold;">${status}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div style="margin-top:10px;font-size:0.8rem;color:#7a4a2a;">
                    💡 حروفی که وضعیت «نیاز به تمرین» دارند را بیشتر تمرین کنید.
                </div>
            `;

            reportBody.innerHTML = html;
        }

        // ====================================================
        //  سیستم ویدیو
        // ====================================================
        function showVideo(subject) {
            const videoSection = document.getElementById('videoSection');
            const videoTitle = document.getElementById('videoTitle');
            const videoWrapper = document.getElementById('videoWrapper');
            const config = VIDEO_CONFIG[subject];

            if (!config) return;

            videoTitle.textContent = config.title;

            if (config.url && config.url.trim() !== '') {
                videoWrapper.innerHTML = `
                    <iframe
                        src="${config.url}"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                `;
            } else {
                videoWrapper.innerHTML = `
                    <div class="video-placeholder">
                        <div class="placeholder-icon">🎬</div>
                        <div class="placeholder-text">ویدیوی آموزشی این بخش به‌زودی اضافه می‌شود</div>
                    </div>
                `;
            }

            videoSection.classList.add('visible');
        }

        function hideVideo() {
            const videoSection = document.getElementById('videoSection');
            const videoWrapper = document.getElementById('videoWrapper');
            videoSection.classList.remove('visible');
            videoWrapper.innerHTML = '';
        }

        // ====================================================
        //  متغیرهای بازی
        // ====================================================
        let currentSubject = 'math';
        let currentQuestions = [];
        let currentIndex = 0;
        let isAnswered = false;
        let currentAudio = null;
        const QUESTIONS_PER_LEVEL = 5;
        let currentLevel = 1;
        let isAllDone = false;
        let levelQuestions = [];

        // ====================================================
        //  عناصر DOM
        // ====================================================
        const questionDisplay = document.getElementById('questionDisplay');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackDisplay = document.getElementById('feedbackDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const buttonContainer = document.getElementById('buttonContainer');
        const progressBar = document.getElementById('progressBar');
        const btnMath = document.getElementById('btnMath');
        const btnAlphabet = document.getElementById('btnAlphabet');
        const questionCounter = document.getElementById('questionCounter');
        const totalQuestionsDisplay = document.getElementById('totalQuestions');
        const audioBtn = document.getElementById('audioBtn');
        const mathReportSection = document.getElementById('mathReportSection');
        const alphabetReportSection = document.getElementById('alphabetReportSection');

        // ====================================================
        //  سیستم صوتی
        // ====================================================
        function playAudio(audioSrc) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                audioBtn.classList.remove('playing');
            }

            if (!audioSrc || audioSrc === '#') {
                const text = questionDisplay.textContent.replace(/[🔤🔢🧮🍎🐶⭐🐱🍭👶🌺✏️]/g, '').trim();
                speakText(text);
                return;
            }

            try {
                currentAudio = new Audio(audioSrc);
                currentAudio.play();
                audioBtn.classList.add('playing');

                currentAudio.onended = function() {
                    audioBtn.classList.remove('playing');
                };

                currentAudio.onerror = function() {
                    audioBtn.classList.remove('playing');
                    const text = questionDisplay.textContent.replace(/[🔤🔢🧮🍎🐶⭐🐱🍭👶🌺✏️]/g, '').trim();
                    speakText(text);
                };
            } catch(e) {
                const text = questionDisplay.textContent.replace(/[🔤🔢🧮🍎🐶⭐🐱🍭👶🌺✏️]/g, '').trim();
                speakText(text);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
                audioBtn.classList.add('playing');
                setTimeout(() => {
                    audioBtn.classList.remove('playing');
                }, 2000);
            }
        }

        // ====================================================
        //  توابع بازی
        // ====================================================

        function getQuestionsForSubject(subject) {
            return preschoolQuestions[subject] || [];
        }

        function loadSubject(subject) {
            currentSubject = subject;
            const all = getQuestionsForSubject(subject);
            currentQuestions = shuffleArray([...all]);
            currentLevel = 1;
            isAllDone = false;
            loadLevel();

            btnMath.classList.toggle('active', subject === 'math');
            btnAlphabet.classList.toggle('active', subject === 'alphabet');

            showVideo(subject);

            if (subject === 'math') {
                mathReportSection.classList.add('visible');
                alphabetReportSection.classList.remove('visible');
                updateMathReport();
            } else {
                alphabetReportSection.classList.add('visible');
                mathReportSection.classList.remove('visible');
                updateAlphabetReport();
            }

            if (currentQuestions.length === 0) {
                questionDisplay.innerHTML = '🎁 سوالی برای این بخش وجود ندارد!';
                optionsContainer.innerHTML = '';
                feedbackDisplay.className = 'feedback info';
                feedbackDisplay.innerHTML = '🌟 لطفاً بخش دیگری را انتخاب کنید.';
                nextBtn.disabled = true;
                progressBar.style.width = '0%';
                return;
            }
        }

        function loadLevel() {
            const startIndex = (currentLevel - 1) * QUESTIONS_PER_LEVEL;
            const endIndex = startIndex + QUESTIONS_PER_LEVEL;
            levelQuestions = currentQuestions.slice(startIndex, endIndex);

            if (levelQuestions.length === 0) {
                showAllDone();
                return;
            }

            currentIndex = 0;
            isAnswered = false;
            totalQuestionsDisplay.textContent = levelQuestions.length;
            renderQuestion();
        }

        function showAllDone() {
            isAllDone = true;
            questionDisplay.innerHTML = '🎉 تبریک! همه‌ی سوالات رو با موفقیت گذروندی!';
            optionsContainer.innerHTML = '';
            feedbackDisplay.className = 'feedback all-done';
            feedbackDisplay.innerHTML = `
                🌟 آفرین! تو تمام سوالات را پاسخ دادی! <br>
                🔄 برای شروع مجدد، دکمه‌ی زیر را بزنید.
            `;
            progressBar.style.width = '100%';
            audioBtn.style.display = 'none';

            buttonContainer.innerHTML = `
                <button class="btn-restart" id="restartBtn">🔄 شروع مجدد</button>
            `;
            document.getElementById('restartBtn').addEventListener('click', function() {
                restartGame();
            });
        }

        function restartGame() {
            buttonContainer.innerHTML = `<button class="next-btn" id="nextBtn">⏩ سوال بعدی</button>`;
            document.getElementById('nextBtn').addEventListener('click', goToNextLevel);
            audioBtn.style.display = 'flex';

            const all = getQuestionsForSubject(currentSubject);
            currentQuestions = shuffleArray([...all]);
            currentLevel = 1;
            isAllDone = false;
            loadLevel();

            document.getElementById('nextBtn').addEventListener('click', goToNextLevel);
        }

        function renderQuestion() {
            if (currentIndex >= levelQuestions.length) {
                showLevelComplete();
                return;
            }

            const q = levelQuestions[currentIndex];
            questionDisplay.innerHTML = q.question;

            audioBtn.style.display = 'flex';
            audioBtn.textContent = '🔊';
            audioBtn.classList.remove('playing');
            audioBtn.dataset.audio = q.audio || '';

            const isMath = (currentSubject === 'math');
            optionsContainer.style.direction = isMath ? 'ltr' : 'rtl';

            const shuffledOptions = shuffleArray(q.options.map((opt, idx) => ({ opt, idx })));
            const newCorrectIndex = shuffledOptions.findIndex(item => item.idx === q.correct);

            q._shuffledOptions = shuffledOptions.map(item => item.opt);
            q._newCorrect = newCorrectIndex;

            optionsContainer.innerHTML = '';
            q._shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-index', idx);
                btn.textContent = opt;
                btn.addEventListener('click', () => handleOptionClick(idx));
                optionsContainer.appendChild(btn);
            });

            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('correct-highlight', 'wrong-highlight');
                b.disabled = false;
                b.style.pointerEvents = 'auto';
            });

            feedbackDisplay.className = 'feedback';
            feedbackDisplay.innerHTML = '🤔 کدوم گزینه درسته؟ یکی رو انتخاب کن!';
            isAnswered = false;
            nextBtn.disabled = true;
            updateQuestionCounter();
            updateProgressBar();
        }

        function handleOptionClick(selectedIndex) {
            if (isAnswered) return;
            const q = levelQuestions[currentIndex];
            const isCorrect = (selectedIndex === q._newCorrect);

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.style.pointerEvents = 'none';
                if (idx === q._newCorrect) {
                    btn.classList.add('correct-highlight');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong-highlight');
                }
            });

            updateStats(currentSubject, q.item, isCorrect);

            feedbackDisplay.className = 'feedback';
            if (isCorrect) {
                feedbackDisplay.classList.add('correct');
                feedbackDisplay.innerHTML = '🎉 آفرین! خیلی خوب بود! ⭐';
            } else {
                feedbackDisplay.classList.add('wrong');
                feedbackDisplay.innerHTML = '😅 اشتباه گفتی! دوباره تلاش کن! 💪';
            }

            isAnswered = true;
            nextBtn.disabled = false;
            updateQuestionCounter();
            updateProgressBar();
        }

        function goToNext() {
            if (!isAnswered) return;
            currentIndex++;
            renderQuestion();
        }

        function showLevelComplete() {
            questionDisplay.innerHTML = '🎊 مرحله تمام شد!';
            optionsContainer.innerHTML = '';
            feedbackDisplay.className = 'feedback level-complete';
            audioBtn.style.display = 'none';

            feedbackDisplay.innerHTML = `
                🌟 آفرین! تو این مرحله رو کامل کردی! <br>
                📈 برو به مرحله بعد!
            `;
            nextBtn.disabled = false;
            nextBtn.textContent = '📈 مرحله بعدی';
        }

        function goToNextLevel() {
            if (nextBtn.textContent === '📈 مرحله بعدی') {
                currentLevel++;
                loadLevel();
                nextBtn.textContent = '⏩ سوال بعدی';
                audioBtn.style.display = 'flex';
            } else {
                goToNext();
            }
        }

        function updateQuestionCounter() {
            questionCounter.textContent = Math.min(currentIndex + 1, levelQuestions.length);
        }

        function updateProgressBar() {
            const totalAnswered = (currentLevel - 1) * QUESTIONS_PER_LEVEL + currentIndex;
            const totalAll = currentQuestions.length;
            const progress = totalAll > 0 ? (totalAnswered / totalAll) * 100 : 0;
            progressBar.style.width = Math.min(progress, 100) + '%';
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ====================================================
        //  رویدادها
        // ====================================================

        audioBtn.addEventListener('click', function() {
            const audioSrc = this.dataset.audio || '';
            if (this.classList.contains('playing')) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                if ('speechSynthesis' in window) {
                    speechSynthesis.cancel();
                }
                this.classList.remove('playing');
                return;
            }
            playAudio(audioSrc);
        });

        btnMath.addEventListener('click', () => {
            if (currentSubject === 'math') return;
            loadSubject('math');
        });

        btnAlphabet.addEventListener('click', () => {
            if (currentSubject === 'alphabet') return;
            loadSubject('alphabet');
        });

        nextBtn.addEventListener('click', goToNextLevel);

        document.getElementById('closeVideoBtn').addEventListener('click', function() {
            hideVideo();
        });

        document.getElementById('mathReportToggle').addEventListener('click', function() {
            const content = document.getElementById('mathReportContent');
            content.classList.toggle('show');
            if (content.classList.contains('show')) {
                updateMathReport();
                this.textContent = '📊 بستن پیشرفت ریاضی';
            } else {
                this.textContent = '📊 پیشرفت ریاضی';
            }
        });

        document.getElementById('alphabetReportToggle').addEventListener('click', function() {
            const content = document.getElementById('alphabetReportContent');
            content.classList.toggle('show');
            if (content.classList.contains('show')) {
                updateAlphabetReport();
                this.textContent = '📊 بستن پیشرفت الفبا';
            } else {
                this.textContent = '📊 پیشرفت الفبا';
            }
        });

        document.getElementById('mathResetBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (confirm('🔄 آیا مطمئن هستی که می‌خواهی همه‌ی آمار ریاضی رو پاک کنی؟')) {
                mathStats = {};
                saveStats();
                updateMathReport();
                alert('✅ آمار ریاضی با موفقیت پاک شد.');
            }
        });

        document.getElementById('alphabetResetBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (confirm('🔄 آیا مطمئن هستی که می‌خواهی همه‌ی آمار الفبا رو پاک کنی؟')) {
                letterStats = {};
                saveStats();
                updateAlphabetReport();
                alert('✅ آمار الفبا با موفقیت پاک شد.');
            }
        });

        // ====================================================
        //  راه‌اندازی صفحه
        // ====================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 صفحه پیش‌دبستانی با ویدیو و گزارش بارگذاری شد');

            if (typeof initUserSystem === 'function') {
                initUserSystem();
            }

            loadStats();
            loadSubject('math');
        });

        window.addEventListener('beforeunload', function() {
            if (currentUser) saveUser();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
